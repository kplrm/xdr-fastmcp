services:
  xdr-fastmcp:
    build:
      context: .
    image: xdr-fastmcp:local
    container_name: xdr-fastmcp
    # Pass local credentials to tools; the file is optional.
    env_file:
      - path: ./.env
        required: false
    network_mode: host
    volumes:
      # Load local tools without rebuilding; the container cannot modify them.
      - ./tools:/app/tools:ro
      # Load trusted CA certificates.
      - ./certs:/app/certs:ro
    # Forward signals and reap exited child processes launched by tools.
    init: true
    restart: unless-stopped
    # Docker rotates captured logs automatically and removes the oldest file.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    # Remove Linux capabilities; ordinary Python tools do not require them.
    cap_drop:
      - ALL
    # Prevent processes from gaining privileges through executable files.
    security_opt:
      - no-new-privileges:true
