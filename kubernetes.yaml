apiVersion: apps/v1
kind: Deployment
metadata:
  name: xdr-fastmcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xdr-fastmcp
  template:
    metadata:
      labels:
        app: xdr-fastmcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65533
      initContainers:
        - name: sync-tools
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=https://github.com/kplrm/xdr-fastmcp.git
            - --ref=main
            - --root=/git
            - --link=repo
            - --one-time
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tools
              mountPath: /git
      containers:
        - name: xdr-fastmcp
          image: ghcr.io/kplrm/xdr-fastmcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: xdr-fastmcp-env
          env:
            - name: PYTHONPATH
              value: /git/repo
            - name: OPENSEARCH_URL
              value: https://opensearch-cluster-master.opensearch.svc.cluster.local:9200
            - name: OPENSEARCH_VERIFY_TLS
              value: "true"
            - name: OPENSEARCH_CA_FILE
              value: /app/certs/root-ca.pem
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tools
              mountPath: /git
              readOnly: true
            - name: ca
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: tools
          emptyDir: {}
        - name: ca
          configMap:
            name: opensearch-ca
---
apiVersion: v1
kind: Service
metadata:
  name: xdr-fastmcp
spec:
  selector:
    app: xdr-fastmcp
  ports:
    - port: 8000
      targetPort: http
